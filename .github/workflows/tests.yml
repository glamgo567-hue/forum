name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forum_user
          POSTGRES_PASSWORD: forum_pass
          POSTGRES_DB: forum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U forum_user -d forum_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+asyncpg://forum_user:forum_pass@localhost:5432/forum_test
      SECRET_KEY: test_secret_key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements-dev.txt

      - name: Check migrations apply cleanly
        run: alembic upgrade head

      - name: Run tests
        run: pytest